version: "3.9"

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # GPU support — remove deploy block if no GPU available
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]

  agent:
    build: .
    container_name: senior-dev-agent
    ports:
      - "8000:8080"
    environment:
      LLM_BACKEND: ollama
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: deepseek-coder:33b
    depends_on:
      - ollama
    # Re-build on source change during dev
    volumes:
      - ./app:/app/app

volumes:
  ollama_data:
